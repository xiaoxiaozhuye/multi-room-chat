spring:
  application:
    name: multi-room-chat
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  error:
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-},userId=%X{userId:-},roomId=%X{roomId:-},messageId=%X{messageId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

mybatis:
  type-handlers-package: com.multichat.infrastructure.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

chat:
  retention:
    # Calendar months are used so “three months” follows the business policy,
    # rather than treating it as an imprecise number of days.
    messages:
      enabled: true
      retention-months: 3
      batch-size: 500
      max-batch-retries: 3
      cron: "0 20 3 * * *"
  audit:
    # Audit logs are excluded from message cleanup.  Any future audit purge
    # must use this independent, longer policy and its own approved process.
    retention-months: 36
