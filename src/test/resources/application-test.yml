spring:
  datasource:
    url: jdbc:h2:mem:multi_room_chat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
management:
  health:
    redis:
      enabled: false
    db:
      enabled: false

chat:
  redis:
    enabled: false
  security:
    jwt:
      issuer: multi-room-chat-test
      secret: dGVzdC1zaWduaW5nLWtleS1mb3ItbXVsdGktcm9vbS1jaGF0LTE3LWNoYXJz
      access-token-ttl: PT5M
  review:
    timeout-seconds: 1
    scan-interval: PT1S
  websocket:
    allowed-origins: http://localhost:5173
    heartbeat-interval: PT25S
    heartbeat-timeout: PT75S
